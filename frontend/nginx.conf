# Configuração do Nginx do frontend.
# Entrega a interface React e encaminha a API no MESMO endereço público:
#   /todos, /todos/:id  -> backend:5000 (métodos e caminhos preservados)
#   /health             -> backend:5000/health (saúde da API + conexão ao banco)
server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Resolve "backend" pelo DNS interno do Docker a cada 10s. Assim o Nginx
    # não falha ao subir antes da API e acompanha a troca de IP do contêiner
    # quando a API é reiniciada ou atualizada.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:5000;

    client_max_body_size 16k;

    location = /todos  { proxy_pass $api; include /etc/nginx/proxy_api.conf; }
    location   /todos/ { proxy_pass $api; include /etc/nginx/proxy_api.conf; }
    location = /health { proxy_pass $api; include /etc/nginx/proxy_api.conf; }

    # Arquivos com hash no nome podem ficar em cache; o index.html não.
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
