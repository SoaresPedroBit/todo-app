[defaults]
inventory = /work/infra/ansible/inventario.yml
roles_path = /work/infra/ansible/roles
interpreter_python = /usr/bin/python3
retry_files_enabled = false
stdout_callback = default
result_format = yaml
# VM de 1 GB: uma de cada vez, sem pressa
forks = 2
timeout = 60

[inventory]
# Em volumes do Windows todo arquivo parece executável; sem isto o Ansible
# tentaria EXECUTAR o inventário.
enable_plugins = yaml

[ssh_connection]
pipelining = true
retries = 3
