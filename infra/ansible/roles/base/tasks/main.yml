# --- Swap: a e2-micro tem 1 GB de memória -------------------------------------
- name: Reservar o arquivo de swap (1 GB)
  ansible.builtin.command:
    cmd: fallocate -l 1G /swapfile
    creates: /swapfile

- name: Restringir o arquivo de swap
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Verificar o swap em uso
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_ativo
  changed_when: false
  check_mode: false # leitura: roda também na simulação

- name: Ativar o swap
  ansible.builtin.shell: |
    set -e
    blkid -p -t TYPE=swap /swapfile >/dev/null 2>&1 || mkswap -q /swapfile
    swapon /swapfile
  when: "'/swapfile' not in swap_ativo.stdout_lines"
  changed_when: true

- name: Ativar o swap em todo boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: /swapfile none swap sw 0 0

# --- Pacotes -------------------------------------------------------------------
- name: Listar os pacotes instalados
  ansible.builtin.package_facts:
    manager: apt

# Só acessa a internet se faltar algo: com o NAT desligado, a VM do banco não a alcança
- name: Instalar Docker e utilitários
  ansible.builtin.apt:
    name: "{{ faltando }}"
    state: present
    update_cache: true
    install_recommends: true
    lock_timeout: 300
  vars:
    necessarios:
      - docker.io
      - docker-compose-v2
      - jq
      - cron
      - curl
      - netcat-openbsd
      - iptables
    faltando: "{{ necessarios | difference(ansible_facts.packages.keys() | list) }}"
  when: faltando | length > 0

- name: Manter Docker e cron ligados
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - docker
    - cron

- name: Criar a pasta de operação
  ansible.builtin.file:
    path: /opt/todo
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- Atualizações do sistema operacional (parâmetro update_os) ----------------
# A verificação roda sempre, só lendo o cache do apt (sem internet e sem mudar
# nada); a aplicação das atualizações depende do parâmetro.
- name: Verificar atualizações pendentes do sistema operacional
  ansible.builtin.command: apt list --upgradable
  register: apt_pendentes
  changed_when: false
  check_mode: false # leitura: roda também na simulação

- name: Mostrar as atualizações pendentes
  ansible.builtin.debug:
    msg: >-
      {{ pendentes | length }} pacote(s) com atualização pendente no cache do apt
      {{ '(serão aplicadas: update_os=true)' if update_os | default(false) | bool else '(não aplicadas: update_os=false)' }}{{
      ': ' ~ (pendentes | map('regex_replace', '/.*$', '') | join(', ')) if pendentes | length > 0 else '' }}
  vars:
    pendentes: "{{ apt_pendentes.stdout_lines | select('search', 'upgradable from') | list }}"

- name: Atualizar pacotes do sistema operacional (quando update_os=true)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    lock_timeout: 300
  when: update_os | default(false) | bool

# Kernel e bibliotecas novos só valem após reiniciar. A VM não é reiniciada
# sozinha (derrubaria o site no meio da pipeline): o aviso fica no registro.
- name: Verificar se o sistema pede reinício
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reinicio

- name: Avisar sobre reinício pendente
  ansible.builtin.debug:
    msg: "Reinício pendente após atualizações (kernel ou bibliotecas). Reinicie a VM em horário sem visitantes."
  when: reinicio.stat.exists

# --- Pacotes adicionais (parâmetro extra_packages) ----------------------------
# Aceita "curl,git,unzip" ou "curl git unzip"; state: present mantém a
# reexecução idempotente (já instalado = sem alteração).
- name: Instalar pacotes adicionais solicitados na pipeline
  ansible.builtin.apt:
    name: "{{ extra_packages.replace(',', ' ').split() }}"
    state: present
    update_cache: true
    lock_timeout: 300
  when:
    - extra_packages is defined
    - extra_packages.replace(',', ' ').split() | length > 0