# Entrega e verificação na Google Cloud, por execução manual (aba Actions).
#
# Sem chave de conta de serviço: a identidade vem por OIDC (infra/gcp-ci).
# Configuração do repositório:
#   Variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, TODO_SSH_PUB
#   Secrets:   TODO_SSH_KEY (chave privada de .local/gcp/ssh/id_ed25519)
name: GCP

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que executar"
        type: choice
        default: planejar
        options: [planejar, implantar, rollback, aceite]
      versao:
        description: "Versão (só para rollback)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp
  cancel-in-progress: false

jobs:
  executar:
    name: ${{ inputs.acao }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Configuração local
        env:
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
          CHAVE: ${{ secrets.TODO_SSH_KEY }}
          PUB: ${{ vars.TODO_SSH_PUB }}
        run: |
          printf 'project_id = "%s"\n' "$PROJETO" > infra/gcp/terraform.tfvars
          echo 'saida_internet_banco = false' > infra/gcp/nat.auto.tfvars
          install -d -m 700 .local/gcp/ssh
          (umask 077; printf '%s\n' "$CHAVE" > .local/gcp/ssh/id_ed25519)
          printf '%s\n' "$PUB" > .local/gcp/ssh/id_ed25519.pub

      - name: Planejar (nada é alterado)
        run: |
          set -o pipefail
          ./scripts/pipeline-gcp.sh planejar | tee plano.txt

      - name: Implantar (versão = SHA do commit)
        if: inputs.acao == 'implantar'
        run: ./scripts/pipeline-gcp.sh implantar

      - name: Rollback
        if: inputs.acao == 'rollback'
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          [[ $VERSAO =~ ^[A-Za-z0-9._-]+$ ]] || { echo "informe uma versão válida"; exit 1; }
          ./scripts/pipeline-gcp.sh implantar "$VERSAO"

      - name: Critérios de aceite
        if: inputs.acao == 'aceite'
        run: ./scripts/pipeline-gcp.sh aceite

      - name: Apagar credenciais do runner
        if: always()
        run: rm -rf .local/gcp/ssh .local/gcp/segredos

      - name: Anexar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-gcp-${{ inputs.acao }}
          path: |
            plano.txt
            .local/evidencias/
          if-no-files-found: warn
          include-hidden-files: true
